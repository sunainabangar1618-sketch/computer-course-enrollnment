<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Course Enrollment</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f5ff;
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 450px;
      margin: 40px auto;
      background: white;
      padding: 25px;
      border-radius: 12px;
      box-shadow: 0 2px 12px #ccc;
    }

    h1 {
      text-align: center;
      color: #243b80;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select, button {
      width: 100%;
      padding: 12px;
      margin-top: 7px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      margin-top: 22px;
      background: #243b80;
      color: white;
      border: none;
      cursor: pointer;
    }

    button:disabled {
      background: #888;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Course Enrollment</h1>

    <p id="loginStatus">Checking login status...</p>

    <form id="enrollmentForm">
      <label for="name">Full Name</label>
      <input id="name" type="text" required>

      <label for="email">Email</label>
      <input id="email" type="email" readonly>

      <label for="course">Select Course</label>
      <select id="course" required>
        <option value="">Choose a course</option>
        <option value="Web Development">Web Development</option>
        <option value="Python Programming">Python Programming</option>
        <option value="Java Programming">Java Programming</option>
        <option value="C Programming">C Programming</option>
        <option value="Data Science">Data Science</option>
        <option value="Computer Basics">Computer Basics</option>
      </select>

      <button id="submitButton" type="submit" disabled>
        Submit Enrollment
      </button>
    </form>

    <p id="message"></p>
    <p><a href="authentication.html">Go to Login / Sign Up</a></p>
    <p><a href="index.html">Back to Home</a></p>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";

    import {
      getAuth,
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

    import {
      getFirestore,
      collection,
      addDoc,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCbDOwqgUGplj6vY_DcymHK1HkjHN9aJOg",
      authDomain: "computer-course-enrollme-e0cad.firebaseapp.com",
      projectId: "computer-course-enrollme-e0cad",
      storageBucket: "computer-course-enrollme-e0cad.firebasestorage.app",
      messagingSenderId: "629890393995",
      appId: "1:629890393995:web:f02871bb17c5d0d580b18e"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById("enrollmentForm");
    const emailInput = document.getElementById("email");
    const nameInput = document.getElementById("name");
    const courseInput = document.getElementById("course");
    const submitButton = document.getElementById("submitButton");
    const message = document.getElementById("message");
    const loginStatus = document.getElementById("loginStatus");

    let currentUser = null;

    onAuthStateChanged(auth, (user) => {
      currentUser = user;

      if (user) {
        loginStatus.textContent = "You are logged in.";
        emailInput.value = user.email || "";
        submitButton.disabled = false;
      } else {
        loginStatus.textContent = "Please log in before enrolling.";
        emailInput.value = "";
        submitButton.disabled = true;
      }
    });

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      message.textContent = "";

      if (!currentUser) {
        message.textContent = "Please log in first.";
        return;
      }

      const name = nameInput.value.trim();
      const course = courseInput.value;

      if (!name || !course) {
        message.textContent = "Please fill in all fields.";
        return;
      }

      submitButton.disabled = true;
      submitButton.textContent = "Submitting...";

      try {
        await addDoc(collection(db, "enrollments"), {
          name: name,
          email: currentUser.email,
          course: course,
          uid: currentUser.uid,
          createdAt: serverTimestamp()
        });

        message.textContent = "Enrollment submitted successfully!";
        form.reset();
        emailInput.value = currentUser.email || "";

      } catch (error) {
        console.error(error);
        message.textContent = "Could not submit enrollment. Please try again.";
      }

      submitButton.disabled = !currentUser;
      submitButton.textContent = "Submit Enrollment";
    });
  </script>
</body>
</html>
