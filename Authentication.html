
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Computer Academy</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fc;
      min-height: 100vh;
    }

    header {
      background: #142b55;
      color: white;
      padding: 22px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
      font-weight: bold;
    }

    .container {
      max-width: 430px;
      margin: 55px auto;
      padding: 20px;
    }

    .login-box {
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.09);
    }

    h1 {
      text-align: center;
      color: #142b55;
      margin-bottom: 12px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      background: #2878d0;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      margin-top: 22px;
      cursor: pointer;
    }

    button:hover {
      background: #142b55;
    }

    .signup {
      text-align: center;
      margin-top: 20px;
      color: #555;
    }

    footer {
      background: #142b55;
      color: white;
      text-align: center;
      padding: 20px;
    }
  </style>
</head>

<body>

  <header>
    <h2>Computer Academy</h2>
    <nav>
      <a href="index.html">Home</a>
      <a href="courses.html">Courses</a>
      <a href="enrollment.html">Enroll</a>
    </nav>
  </header>

  <div class="container">
    <div class="login-box">
      <h1>Welcome Back!</h1>
      <p class="subtitle">Login to your student account</p>

      <form id="loginForm">
        <label for="email">Email Address</label>
        <input type="email" id="email" placeholder="Enter your email" required>

        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required minlength="6">

        <button type="submit">Login</button>
      </form>

      <p class="signup">New student? Sign up option will be added with Firebase.</p>
    </div>
  </div>

  <footer>
    <p>© 2026 Computer Academy | All Rights Reserved</p>
  </footer>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
      event.preventDefault();
      alert("Login page is ready. Firebase Authentication will be connected next.");
    });
  </script>

</body>
</html>
